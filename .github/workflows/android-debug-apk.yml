name: Android standalone evaluation APK (debug signed)

on:
  push:
    branches:
      - feat/port-indexes-shopify-theme-to-react-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/build-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK_ROOT"
          ls "$SDK_ROOT/build-tools"
      - name: Install application dependencies
        run: npm install --no-fund --no-audit
      - name: Run JavaScript and checkout API regression tests
        run: npm run verify
      - name: Generate real Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Confirm generated Android splash background resource
        run: |
          grep -R 'name="splashscreen_background"' android/app/src/main/res/values
      - name: Bundle JS and compile standalone Android evaluation APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --stacktrace
      - name: Verify APK, identity and signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          printf 'commit_sha=%s\nbuild_type=release-variant-debug-signed-for-evaluation\nsigner_note=Android debug certificate (not a production signing identity); this APK is for fresh installations only\n' "$GITHUB_SHA" > verification/build-info.txt
          sha256sum "$APK" > verification/apk-sha256.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" > verification/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > verification/apk-signature.txt
          grep "package: name='com.indexesstore.mobile'" verification/apk-badging.txt
          grep "versionName='0.2.0'" verification/apk-badging.txt
          unzip -l "$APK" > verification/apk-contents.txt
          grep -q 'assets/index.android.bundle' verification/apk-contents.txt
          echo "APK verified against expected Android application ID and JS bundle"
      - name: Publish installable debug APK and verification report
        uses: actions/upload-artifact@v4
        with:
          name: indexes-store-android-modern-0.2.0
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            verification/*.txt

  android-emulator-smoke:
    name: Android emulator E2E (launch, categories and cart)
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Download APK built in this run
        uses: actions/download-artifact@v4
        with:
          name: indexes-store-android-modern-0.2.0
          path: apk-files
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot emulator, launch APK and test tabs
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p smoke
            APK="$(find apk-files -type f -name app-release.apk -print -quit)"
            test -s "$APK"
            adb wait-for-device
            adb install "$APK"
            adb logcat -c
            adb shell am start -W -n com.indexesstore.mobile/.MainActivity
            sleep 16
            adb shell pidof com.indexesstore.mobile
            home_ok=0
            for attempt in 1 2 3 4; do
              if adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 \
                && adb pull /sdcard/window.xml smoke/home.xml >/dev/null 2>&1 \
                && python3 scripts/android-smoke-ui.py --file smoke/home.xml --expect "البحث في المنتجات"; then
                home_ok=1
                break
              fi
              sleep 3
            done
            test "$home_ok" -eq 1
            adb shell screencap -p /sdcard/home.png
            adb pull /sdcard/home.png smoke/home.png
            read -r x y < <(python3 scripts/android-smoke-ui.py --file smoke/home.xml --tap "الأقسام")
            adb shell input tap "$x" "$y"
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml smoke/categories.xml
            python3 scripts/android-smoke-ui.py --file smoke/categories.xml --expect "الأقسام الرئيسية"
            adb shell screencap -p /sdcard/categories.png
            adb pull /sdcard/categories.png smoke/categories.png
            read -r x y < <(python3 scripts/android-smoke-ui.py --file smoke/categories.xml --tap "السلة")
            adb shell input tap "$x" "$y"
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml smoke/cart.xml
            python3 scripts/android-smoke-ui.py --file smoke/cart.xml --expect "سلة التسوق فارغة"
            adb shell screencap -p /sdcard/cart.png
            adb pull /sdcard/cart.png smoke/cart.png
            adb logcat -d -v brief > smoke/logcat.txt
            if grep -q 'FATAL EXCEPTION' smoke/logcat.txt; then
              echo "Android recorded a fatal exception."
              exit 1
            fi
            adb shell pidof com.indexesstore.mobile
            printf '%s\n' "home=PASS" "categories=PASS" "empty_cart=PASS" "fatal_exceptions=NONE" > smoke/result.txt
      - name: Upload screenshots, UI tree and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexes-store-android-emulator-smoke
          if-no-files-found: warn
          retention-days: 30
          path: smoke/
