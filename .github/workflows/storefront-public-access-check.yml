name: Public Shopify Storefront API integration (read only)

on:
  push:
    branches:
      - feat/port-indexes-shopify-theme-to-react-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-storefront:
    name: Product and collection GraphQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test configured public token against Shopify (read only)
        run: node scripts/verify-live-storefront.mjs
